<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12">
<title>Ab App Store</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111722;--border:#222c3b;--text:#f5f7fb;--muted:#8793a6;--accent:#4d83ff;--accent2:#38c9e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#18315a 0,transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{width:min(960px,calc(100% - 30px));margin:0 auto}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0c}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px;letter-spacing:-.6px}.brandmark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:19px;font-weight:900;box-shadow:0 8px 24px #347bff35}
main{padding:36px 0 60px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px}h1{font-size:clamp(25px,5vw,34px);letter-spacing:-1.2px;margin:0}.count{font-size:12px;color:#b8c8e6;background:#ffffff08;border:1px solid var(--border);padding:8px 11px;border-radius:99px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}.card{min-width:0;background:linear-gradient(145deg,#141c29,#0e131c);border:1px solid var(--border);border-radius:21px;padding:19px;transition:transform .18s,border-color .18s;box-shadow:0 16px 40px #0002}.card:hover{transform:translateY(-3px);border-color:#426dba}
.apphead{display:flex;align-items:center;gap:14px;min-width:0}.icon{width:67px;height:67px;border-radius:18px;background:#202a3a;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;color:#c4d5f8;font-size:25px;font-weight:800}.icon img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0}.name{margin:0;font-size:17px;font-weight:800;letter-spacing:-.35px;overflow-wrap:anywhere}.meta{margin-top:5px;color:var(--muted);font-size:12px}
.download{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px 15px;border-radius:12px;background:linear-gradient(100deg,#477bff,#347eea);color:white;text-decoration:none;font-size:13px;font-weight:800;box-shadow:0 8px 22px #3a72ff22}.download:active{transform:scale(.99)}.download svg{width:17px;height:17px}
.state{padding:45px 18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:20px;line-height:1.65}.state strong{display:block;color:#e6edf8;font-size:15px;margin-bottom:5px}
footer{padding:17px 0 25px;border-top:1px solid #ffffff0c;color:#647186;text-align:center;font-size:11px}
@media(max-width:520px){header{height:68px}.brand{font-size:18px}main{padding-top:25px}.grid{grid-template-columns:1fr;gap:12px}.card{padding:16px}.icon{width:60px;height:60px;border-radius:16px}}
</style></head><body>
<header class="wrap"><div class="brand"><span class="brandmark">A</span><span>Ab App Store</span></div></header>
<main class="wrap"><div class="topline"><h1>Apps</h1><span class="count" id="count">Loading…</span></div>
<section class="grid" id="apps" aria-live="polite"><div class="state"><strong>Loading apps</strong>Please wait…</div></section></main>
<footer class="wrap">Ab App Store</footer>
<script>
const OWNER="rullergaming662-create",REPO="AB-APP-STORE",BRANCH="main";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const grid=document.getElementById("apps"),count=document.getElementById("count");
function cleanName(filename){return filename.replace(/\.apk$/i,"").replace(/[-_]+/g," ").replace(/\s+/g," ").trim().replace(/\b\w/g,c=>c.toUpperCase());}
function iconFor(apk,files){
 const stem=apk.replace(/\.apk$/i,""),norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,""),target=norm(stem);
 const pngs=files.filter(f=>/\.png$/i.test(f.name)),names=pngs.map(f=>({f,n:norm(f.name.replace(/\.png$/i,""))}));
 return (names.find(x=>x.n===target)||names.find(x=>x.n===target+"icon")||names.find(x=>x.n===target+"logo")||names.find(x=>x.n===target+"app")||{}).f?.name||null;
}
function render(files){
 const apks=files.filter(f=>/\.apk$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
 count.textContent=`${apks.length} ${apks.length===1?"app":"apps"}`;
 if(!apks.length){grid.innerHTML='<div class="state"><strong>No apps found</strong>Upload APK files to this repository to show them here.</div>';return;}
 grid.innerHTML="";
 apks.forEach(apk=>{
  const logo=iconFor(apk.name,files),name=cleanName(apk.name),card=document.createElement("article");card.className="card";
  const head=document.createElement("div");head.className="apphead";
  const icon=document.createElement("div");icon.className="icon";
  if(logo){const img=document.createElement("img");img.src=RAW+encodeURIComponent(logo).replace(/%2F/g,"/");img.alt=name+" logo";img.onerror=()=>{icon.textContent=name.charAt(0).toUpperCase();};icon.appendChild(img);}else icon.textContent=name.charAt(0).toUpperCase();
  const info=document.createElement("div");info.className="info";
  const title=document.createElement("h2");title.className="name";title.textContent=name;
  const meta=document.createElement("div");meta.className="meta";meta.textContent="Android APK";info.append(title,meta);head.append(icon,info);
  const link=document.createElement("a");link.className="download";link.href=RAW+encodeURIComponent(apk.name).replace(/%2F/g,"/");link.setAttribute("download",apk.name);
  link.innerHTML='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v3h16v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Download APK';
  card.append(head,link);grid.appendChild(card);
 });
}
fetch(API,{headers:{Accept:"application/vnd.github+json"}}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(render).catch(()=>{count.textContent="Unavailable";grid.innerHTML='<div class="state"><strong>Apps could not be loaded</strong>Please check your internet connection and try again.</div>';});
</script></body></html>
